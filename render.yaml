# Render blueprint for the TaskPay public testnet MVP.
#
# One web service runs BOTH the oracle (poller + sponsor bundler on an
# internal port) and the Next.js frontend (public port 3000) in one container,
# so they share the archive directory (specs / reasoning / disputes) under
# /data (TASKPAY_DATA_DIR). The free plan cannot attach a disk, so /data is
# the container's own filesystem: it lasts for the life of the instance and
# resets on each deploy. On a paid plan, uncomment the `disk` block below to
# persist /data across redeploys — on-chain state is always the source of
# truth either way.
#
# Deploy: Render dashboard → New → Blueprint → this repo. Fill the `sync: false`
# secrets (ORACLE_PRIVATE_KEY, GROQ_API_KEY, AGENT_BOT_PRIVATE_KEY, GITHUB_TOKEN)
# in the
# dashboard after the service is created. See DEPLOY.md → "Public deployment".
#
# Paid-plan persistence (uncomment to enable):
#   disk:
#     name: data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: taskpay
    runtime: docker
    repo: https://github.com/zynorr/Taskpay.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # --- chain / sponsor stack (public constants) ---
      - key: RPC_URL
        value: "https://rpc.botchain.ai"
      - key: CHAIN_ID
        value: "677"
      - key: CONTRACT_ADDRESS
        value: "0x1955D52833863B8e74c095457b5bE47332BAd6dF"
      - key: ENTRY_POINT
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - key: AA_FACTORY
        value: "0xd6fF7d0Db03213800f7Fe8ef961642e7CEcDDa5B"
      - key: PAYMASTER
        value: "0x29BE94cC6308BB497fDA8Be5A51E4bDd95662c9C"
      - key: ORACLE_INTERNAL_URL
        value: http://127.0.0.1:8787
      # --- oracle cadence / sponsor protection ---
      - key: POLL_INTERVAL_SECONDS
        value: "10"
      - key: ORACLE_BUNDLER_RATE_LIMIT
        value: "20"
      # Bots publish deliverable evidence to this GitHub repo (created on first
      # use) and submit a pinned repo@<sha> pointer the dispute agents fetch in
      # full. Leave unset to fall back to inline (truncated) text.
      - key: GITHUB_EVIDENCE_REPO
        value: "zynorr/taskpay-evidence"
      # Competing bots poll quickly enough to claim open work before the
      # accept window closes. AGENT_BOTS still supplies the private-key roster.
      - key: AGENT_BOT_POLL_SECONDS
        value: "2"
      - key: AGENT_BOT_ACCEPT_ALL
        value: "false"
      # --- secrets: fill in the Render dashboard ---
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Autonomous agent bot(s): set AGENT_BOTS to a JSON array (one entry per
      # competing agent — each needs a "key", the EOA owning that agent's
      # SimpleAccount, plus optional name/pollSeconds/model/acceptAll/profile)
      # to have the deployed oracle run several agents that race for open
      # tasks. Legacy single-agent alternative: AGENT_BOT_PRIVATE_KEY only.
      # AGENT_BOTS wins when both are set. Each is a secret (holds private
      # keys) — paste the value in the Render dashboard after the service is
      # created; never commit real keys here. The DevBot key you designate on
      # /create resolves to account 0x1ec89529a5E0C4B7D2A71fa37B826648a0EB9c1D.
      - key: AGENT_BOTS
        sync: false
      - key: AGENT_BOT_PRIVATE_KEY
        sync: false
      # GitHub token with repo write scope on the account that owns
      # GITHUB_EVIDENCE_REPO (enables repo-based deliverables). Paste in the
      # dashboard; never commit.
      - key: GITHUB_TOKEN
        sync: false
      # --- frontend build/runtime (NEXT_PUBLIC_* are public by design) ---
      - key: NEXT_PUBLIC_BUNDLER_URL
        value: /api/bundler
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "677"
      - key: NEXT_PUBLIC_TASKPAY_CONTRACT
        value: "0x1955D52833863B8e74c095457b5bE47332BAd6dF"
      - key: NEXT_PUBLIC_ENTRY_POINT
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - key: NEXT_PUBLIC_AA_FACTORY
        value: "0xd6fF7d0Db03213800f7Fe8ef961642e7CEcDDa5B"
      - key: NEXT_PUBLIC_PAYMASTER
        value: "0x29BE94cC6308BB497fDA8Be5A51E4bDd95662c9C"