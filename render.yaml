# Render blueprint for the TaskPay public testnet MVP.
#
# One web service runs BOTH the oracle (poller + sponsor bundler on an
# internal port) and the Next.js frontend (public port 3000) in one container,
# so they share the archive directory (specs / reasoning / disputes) under
# /data (TASKPAY_DATA_DIR). The free plan cannot attach a disk, so /data is
# the container's own filesystem: it lasts for the life of the instance and
# resets on each deploy. On a paid plan, uncomment the `disk` block below to
# persist /data across redeploys — on-chain state is always the source of
# truth either way.
#
# Deploy: Render dashboard → New → Blueprint → this repo. Fill the `sync: false`
# secrets (ORACLE_PRIVATE_KEY, GROQ_API_KEY, AGENT_BOT_PRIVATE_KEY) in the
# dashboard after the service is created. See DEPLOY.md → "Public deployment".
#
# Paid-plan persistence (uncomment to enable):
#   disk:
#     name: data
#     mountPath: /data
#     sizeGB: 1
services:
  - type: web
    name: taskpay
    runtime: docker
    repo: https://github.com/zynorr/Taskpay.git
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # --- chain / sponsor stack (public constants) ---
      - key: RPC_URL
        value: https://rpc.bohr.life
      - key: CHAIN_ID
        value: "968"
      - key: CONTRACT_ADDRESS
        value: "0xCd57fC7d37E9D124493AC78A94E96FC96D1D8E46"
      - key: ENTRY_POINT
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - key: AA_FACTORY
        value: "0xFbfBBD060b1d4E7Edae6D9e58C73F731927b2f2b"
      - key: PAYMASTER
        value: "0x8Ed5e3054A98a6528B666Ca99411648B94A0fDF0"
      - key: ORACLE_INTERNAL_URL
        value: http://127.0.0.1:8787
      # --- oracle cadence / sponsor protection ---
      - key: POLL_INTERVAL_SECONDS
        value: "10"
      - key: ORACLE_BUNDLER_RATE_LIMIT
        value: "20"
      # --- secrets: fill in the Render dashboard ---
      - key: ORACLE_PRIVATE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Autonomous agent bot: set this to have the deployed oracle also run a
      # self-operating worker that accepts tasks created for its smart account
      # (0x1ec89529a5E0C4B7D2A71fa37B826648a0EB9c1D) and submits Groq-generated
      # deliverables — all gasless. Leave unset to run oracle-only.
      - key: AGENT_BOT_PRIVATE_KEY
        sync: false
      # --- frontend build/runtime (NEXT_PUBLIC_* are public by design) ---
      - key: NEXT_PUBLIC_BUNDLER_URL
        value: /api/bundler
      - key: NEXT_PUBLIC_CHAIN_ID
        value: "968"
      - key: NEXT_PUBLIC_TASKPAY_CONTRACT
        value: "0xCd57fC7d37E9D124493AC78A94E96FC96D1D8E46"
      - key: NEXT_PUBLIC_ENTRY_POINT
        value: "0x0000000071727De22E5E9d8BAf0edAc6f37da032"
      - key: NEXT_PUBLIC_AA_FACTORY
        value: "0xFbfBBD060b1d4E7Edae6D9e58C73F731927b2f2b"
      - key: NEXT_PUBLIC_PAYMASTER
        value: "0x8Ed5e3054A98a6528B666Ca99411648B94A0fDF0"